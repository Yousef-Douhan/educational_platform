openapi: 3.0.3
info:
  title: Educational Platform API
  version: 1.0.0
  description: |
    REST API للمنصة التعليمية. المصادقة برمز Bearer من Laravel Passport.
    اللغة عبر ترويسة `Accept-Language` (`ar` أو `en`).
    API الإدارة تحت `/admin/*` يتطلب رمزًا بنطاق `admin` (يُمنح تلقائيًا للموظفين عند الدخول) وصلاحية المورد؛ كل عملية تحمل `x-permission` عندما تُفرض على المسار نفسه، وإلا تُفرض داخل المتحكم بنفس صلاحيات لوحة الـCMS.
    القوائم ترجع `{data, meta{current_page,last_page,per_page,total}, stats?}`. رفع الملفات مع التعديل: `POST` + حقل `_method=PUT`.
    الأخطاء: 401 (غير مصادق)، 403 (محظور)، 404، 422 (تحقق: `message` + `errors`)، 429 (حد الطلبات).
servers:
  - url: http://127.0.0.1:8000/api/v1
tags:
  - name: Auth
  - name: Catalog
  - name: Me
  - name: Learning
  - name: Cart & Orders
  - name: Quizzes
  - name: Certificates
  - name: Notifications
  - name: Live
  - name: Admin · Catalog
  - name: Admin · Users & RBAC
  - name: Admin · Sales
  - name: Admin · Learning
  - name: Admin · System
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema: { type: string, enum: [ar, en] }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 5, maximum: 100, default: 15 } }
    Search: { name: search, in: query, schema: { type: string } }
    Sort: { name: sort, in: query, description: "عمود من القائمة المسموحة لكل مورد، وإلا يُتجاهل", schema: { type: string } }
    Dir: { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        status: { type: string, enum: [active, inactive, suspended] }
        roles: { type: array, items: { type: string } }
        is_staff: { type: boolean }
        created_at: { type: string, format: date-time }
    Token:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time, nullable: true }
        scopes: { type: array, items: { type: string, enum: [student, admin] } }
    AuthData:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { $ref: '#/components/schemas/Token' }
    Category:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        icon: { type: string, nullable: true }
        parent_id: { type: integer, nullable: true }
        children: { type: array, items: { $ref: '#/components/schemas/Category' } }
    Course:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        title_ar: { type: string }
        title_en: { type: string }
        image: { type: string, nullable: true }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        price: { type: string, example: "100.00" }
        discount_price: { type: string, nullable: true }
        final_price: { type: string }
        is_free: { type: boolean }
        currency: { type: string, example: USD }
        lessons_count: { type: integer }
        category: { type: object, nullable: true, properties: { id: { type: integer }, slug: { type: string }, name: { type: string } } }
        instructor: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          properties:
            description: { type: string }
            requirements: { type: array, items: { type: string } }
            outcomes: { type: array, items: { type: string } }
            stats: { type: object, properties: { lessons: { type: integer }, minutes: { type: integer } } }
            sections:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  title: { type: string }
                  lessons:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        type: { type: string, enum: [video, article, document, quiz, live] }
                        duration_minutes: { type: integer }
                        is_free_preview: { type: boolean }
            state:
              type: object
              properties:
                guest: { type: boolean }
                enrolled: { type: boolean }
                in_cart: { type: boolean }
                teaches: { type: boolean }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  responses:
    Unauthenticated: { description: Authentication required }
    Forbidden: { description: "لا صلاحية (رمز بدون نطاق admin، أو ليس موظفًا، أو تنقصه صلاحية المورد)" }
    Validation:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: إنشاء حساب طالب وإرجاع رمز
      description: "الحد: 10 طلبات/دقيقة لكل (IP + بريد). الحالة والأدوار والصلاحيات لا تُقبل من الطلب."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: حروف وأرقام }
                password_confirmation: { type: string }
                device_name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { type: object, properties: { message: { type: string }, data: { $ref: '#/components/schemas/AuthData' } } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/login:
    post:
      tags: [Auth]
      summary: تسجيل الدخول وإرجاع رمز
      description: "نفس رسالة الخطأ لبريد غير موجود أو كلمة مرور خاطئة أو حساب غير نشط. الموظف يحصل على نطاق admin أيضًا."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AuthData' } } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: "طلب رابط استعادة (الرد واحد دائماً، الحسابات غير النشطة لا تستلم)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: "إعادة تعيين كلمة المرور بالرمز المرسل (يلغي كل الرموز)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, email, password, password_confirmation], properties: { token: { type: string }, email: { type: string, format: email }, password: { type: string, minLength: 8 }, password_confirmation: { type: string } } }
      responses:
        '200': { description: OK }
        '422': { description: "رمز غير صالح (code=invalid_reset) أو خطأ تحقق" }
  /auth/email/verification-notification:
    post:
      tags: [Auth]
      summary: "إعادة إرسال رسالة تحقق البريد (3/دقيقة)"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: "تسجيل الخروج من كل الأجهزة (إلغاء كل الرموز)"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: إبطال رمز الجهاز الحالي
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me:
    get:
      tags: [Me]
      summary: بيانات المستخدم الحالي
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: الحساب غير نشط }
    put:
      tags: [Me]
      summary: تعديل الاسم فقط
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /me/password:
    put:
      tags: [Me]
      summary: تغيير كلمة المرور (يُسجَّل الخروج من الأجهزة الأخرى)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /categories:
    get:
      tags: [Catalog]
      summary: شجرة الفئات
      parameters: [{ $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
  /courses:
    get:
      tags: [Catalog]
      summary: الدورات المنشورة (ترقيم صفحات)
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, description: slug الفئة (يشمل الفروع), schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [beginner, intermediate, advanced] } }
        - { name: price, in: query, schema: { type: string, enum: [free, paid] } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Course' } }, links: { type: object }, meta: { type: object } } } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /courses/{slug}:
    get:
      tags: [Catalog]
      summary: تفاصيل دورة منشورة والمنهج (بدون محتوى الدروس أو روابط الفيديو)
      description: اختياري إرسال Bearer لإرجاع حالة المستخدم (مسجّل/في السلة).
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CourseDetail' } } } } } }
        '404': { description: غير موجودة أو غير منشورة }
  /my-courses:
    get:
      tags: [Learning]
      summary: "دوراتي مع نسبة التقدم"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /courses/{slug}/enroll:
    post:
      tags: [Learning]
      summary: "التسجيل في دورة مجانية"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /learn/{slug}:
    get:
      tags: [Learning]
      summary: "منهج الدورة (للمسجّل) مع الإكمال والدرس التالي"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /learn/{slug}/lessons/{lesson}:
    get:
      tags: [Learning]
      summary: "محتوى درس (فيديو/نص/مرفقات/اختبار)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lesson, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /learn/{slug}/lessons/{lesson}/complete:
    post:
      tags: [Learning]
      summary: "إكمال درس"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lesson, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
    delete:
      tags: [Learning]
      summary: "إلغاء إكمال درس"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lesson, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /attachments/{attachment}/download:
    get:
      tags: [Learning]
      summary: "تنزيل مرفق درس"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /cart:
    get:
      tags: [Cart & Orders]
      summary: "السلة"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
    post:
      tags: [Cart & Orders]
      summary: "إضافة دورة للسلة"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [course_id], properties: { course_id: { type: integer } } }
      responses:
        '201': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /cart/{course}:
    delete:
      tags: [Cart & Orders]
      summary: "إزالة دورة من السلة"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: course, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /checkout:
    post:
      tags: [Cart & Orders]
      summary: "إنشاء طلب من السلة (الأسعار تُثبَّت في الخادم)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [], properties: { coupon: { type: string } } }
      responses:
        '201': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /orders:
    get:
      tags: [Cart & Orders]
      summary: "طلباتي (ترقيم صفحات)"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /orders/{number}:
    get:
      tags: [Cart & Orders]
      summary: "تفاصيل طلب وإيصالاته وطرق الدفع"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /orders/{number}/pay:
    post:
      tags: [Cart & Orders]
      summary: "بدء دفع Stripe ويعيد checkout_url"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
        '502': { description: خطأ من البوابة }
        '503': { description: Stripe غير مهيأ }
  /orders/{number}/receipts:
    post:
      tags: [Cart & Orders]
      summary: "رفع إشعار تحويل (صورة jpeg/png/webp حتى 4MB)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [method, sender_name, reference_number, receipt], properties: { method: { type: string }, sender_name: { type: string }, reference_number: { type: string }, receipt: { type: string } } }
      responses:
        '201': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "صلاحية student مطلوبة أو غير مسجّل في الدورة" }
        '404': { description: غير موجود (أو ليس ملكك) }
        '422': { description: "خطأ تحقق أو منطق (message + code)" }
  /payment-methods:
    get:
      tags: [Cart & Orders]
      summary: "طرق التحويل المفعّلة"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
